<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Store - Tech Discount</title>

    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('xresch-blockchain-3750157.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        nav {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 50px;
    padding: 10px 25px; 
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    z-index: 999;
}

nav ul {
    list-style: none;
    display: flex;
    gap: 20px; 
    padding: 0;
    margin: 0;
}

nav a {
    text-decoration: none;
    color: #2d3748; 
    font-weight: 600;
    font-size: 14px;
    transition: all 0.3s ease;
    padding: 8px 12px;
    border-radius: 20px;
}

nav a:hover {
    color: #74099b;
    background: rgba(255, 255, 255, 0.5); 
}

        .box {
            width: 420px;
            padding: 50px 40px;
            margin-top: 20px ;
            border-radius: 24px;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        h2 { 
            font-size: 32px; 
            margin-bottom: 8px; 
            color: #1a202c;
            letter-spacing: -0.5px;
        }

        p { color: #4a5568; margin-bottom: 20px; }

        input {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            font-size: 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: center;
        }

        input:focus {
            border-color: #2d3748;
            box-shadow: 0 0 0 3px rgba(45, 55, 72, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: -16px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #checkBtn {
            background: #2d3748;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #checkBtn:hover {
            background: #1a202c;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        #checkBtn:active {
            transform: translateY(0);
        }

        #checkBtn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
        }

        #restartBtn {
            background: transparent;
            color: #4a5568;
            text-decoration: underline;
            font-size: 16px;
            margin-top: 10px;
        }

        #restartBtn:hover {
            color: #1a202c;
            background: rgba(0,0,0,0.05);
        }

        #message {
            margin-top: 25px;
            font-size: 20px;
            font-weight: 700;
            min-height: 60px;
        }

        .used-text {
            margin-top: 15px;
            font-size: 14px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .error { color: #e53e3e; }
        .success { color: #38a169; }
        .info { color: #d69e2e; }
    </style>
</head>

<body>
 <nav>
            <div>
                <ul>
                    <li><a href="../Sign_up_log_in/index.html">Sign_Up</a></li>
                    <li><a href="../Sign_up_log_in/log_in.html">Log_In</a></li>
                    <li><a href="../Password Generator/index.html">Password Generator</a></li>
                    <li><a href="../Discount/index.html">Get Your Sale</a></li>
                    <li><a href="../XO/index.html">Game</a></li>
                </ul>
            </div>
        </nav>
    <div class="box">
         
        <h2>Furniture Sale</h2>
        <p>Guess the code (1-100) to win your discount</p>
        
        <input type="number" id="guess" placeholder="Enter Code" min="1" max="100">
        <br>
        
        <button id="checkBtn">Check Code</button>
        <button id="restartBtn">Reset Game</button>

        <p id="message"></p>

        <p class="used-text">
            Attempts Used: <span id="used">0</span> / 10
        </p>
    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let attemptsUsed = 0;

        const checkBtn = document.getElementById("checkBtn");
        const restartBtn = document.getElementById("restartBtn");
        const guessInput = document.getElementById("guess");
        const messageDisplay = document.getElementById("message");
        const usedDisplay = document.getElementById("used");

        checkBtn.addEventListener("click", function () {
            let userGuess = guessInput.value;

            if (userGuess === "") {
                messageDisplay.innerText = "Please enter a number";
                messageDisplay.className = "error";
                return;
            }

            attemptsUsed++;
            usedDisplay.innerText = attemptsUsed;

            if (parseInt(userGuess) === randomNumber) {
                let discount = 10 - attemptsUsed;
                messageDisplay.innerHTML = "Winner! 🎉 <br> You got " + discount + "% discount!";
                messageDisplay.className = "success";
                checkBtn.disabled = true;
            } 
            else {
                if (attemptsUsed >= 10) {
                    messageDisplay.innerText = "Game Over! Code was " + randomNumber;
                    messageDisplay.className = "error";
                    checkBtn.disabled = true;
                } 
                else {
                  const guessedNumber = Number(userGuess);
                  let diff = Math.abs(guessedNumber - randomNumber);
                  let isHigh = guessedNumber > randomNumber;

                    if (diff <= 5) {
                        hint = isHigh ? "High (Very Close!)" : "Low (Very Close!)";
                    } else {
                        hint = isHigh ? "High" : "Low";
                    }
                    
                    messageDisplay.innerText = hint;
                    messageDisplay.className = "info";
                }
            }
        });

        restartBtn.addEventListener("click", function () {
            randomNumber = Math.floor(Math.random() * 100) + 1;
            attemptsUsed = 0;
            guessInput.value = "";
            messageDisplay.innerText = "";
            usedDisplay.innerText = "0";
            checkBtn.disabled = false;
        });
    </script>

</body>
</html>
